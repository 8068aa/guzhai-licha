name: 每日更新股债利差
on:
  schedule:
    - cron: '50 07 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 烘焙数据（失败自动重试）
        run: |
          for i in 1 2 3; do
            python update_spread.py && exit 0
            if [ $i -lt 3 ]; then
              echo "第 $i 次失败，10 分钟后重试"
              sleep 600
            else
              echo "重试 3 次后仍失败，今日数据未更新（页面继续使用上次烘焙数据）"
            fi
          done
          exit 0
      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: daily spread update $(date +%F)" || exit 0
          git push
